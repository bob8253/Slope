<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Slope — Fullscreen</title>

  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="TemplateData/unityloader41.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .webgl-content { width:100vw; height:100vh; position:relative; }
    #gameContainer { width:100%; height:100%; margin:0; position:relative; }

    #splashOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.6));
      z-index: 9999;
      gap: 14px;
      flex-direction: column;
      color: white;
      text-align: center;
    }
    #startBtn {
      background: #2ecc71;
      color: #032;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    #hint { font-size: 13px; opacity: .9; max-width: 86vw; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
    <div id="splashOverlay" role="dialog" aria-modal="true">
      <div>
        <h1 style="margin:0 0 8px 0; font-size:20px;">Slope</h1>
        <div id="hint">Tap or click Start to initialize and enter fullscreen. Press Esc to exit fullscreen.</div>
      </div>
      <button id="startBtn" type="button">Start Fullscreen</button>
    </div>
  </div>

  <script async src="//static.getclicky.com/101393847.js"></script>
  <noscript><p><img alt="Clicky" width="1" height="1" src="//in.getclicky.com/101393847ns.gif" /></p></noscript>

  <script src="TemplateData/fullscreen-wrapper.js"></script>
</body>
</html>
